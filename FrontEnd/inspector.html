<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini DevTools Inspector</title>
    <style>
        /* --- General Page Styling (The Content) --- */
        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }

        h1 { color: #2c3e50; }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
        }

        button:hover { background-color: #2980b9; }

        /* --- THE INSPECTOR UI (The Tool) --- */

        /* The floating toolbar at the bottom */
        #inspector-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10000; /* Must be on top of everything */
        }

        #inspector-toggle {
            background: #e74c3c;
            font-weight: bold;
        }

        #inspector-toggle.active {
            background: #2ecc71;
        }

        #node-path {
            font-family: monospace;
            font-size: 14px;
            color: #aaa;
        }

        /* The Blue Overlay Box */
        #inspector-overlay {
            position: fixed; /* Fixed relative to viewport */
            border: 2px solid #3498db; /* The blue border */
            background-color: rgba(52, 152, 219, 0.3); /* The semi-transparent blue fill */
            pointer-events: none; /* CRITICAL: Allows mouse to click 'through' the overlay */
            z-index: 9999;
            display: none; /* Hidden by default */
            transition: all 0.1s ease-out; /* Smooth movement */

            /* Label tag above the box */
            box-sizing: border-box;
        }

        #inspector-label {
            position: absolute;

            left: 0;
            background: #3498db;
            color: white;
            padding: 2px 6px;
            font-size: 12px;
            font-family: monospace;
            border-radius: 2px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<!-- Mock Content to Inspect -->
<h1>DOM Inspector Demo</h1>
<p>Click the <strong>"Enable Inspector"</strong> button below, then hover over any element.</p>

<div class="container">
    <div class="card">
        <h2>Card Title</h2>
        <p>This is a paragraph inside a card.</p>
        <button onclick="alert('You clicked the button!')">Click Me</button>
    </div>
    <div class="card">
        <h2>Another Card</h2>
        <ul>
            <li>List Item 1</li>
            <li>List Item 2</li>
            <li>List Item 3</li>
        </ul>
    </div>
</div>

<!-- The Inspector UI Elements -->
<div id="inspector-overlay">
    <div id="inspector-label">div</div>
</div>

<div id="inspector-controls">
    <button id="inspector-toggle">Enable Inspector</button>
    <span id="node-path">Inspector is OFF</span>
</div>

<script src="./inspector.js"></script>
</body>
</html>
